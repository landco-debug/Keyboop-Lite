name: Build Keyboop Lite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned upstream dictionary
        run: bash scripts/restore-words-ru.sh

      - name: Build surgical Lite app
        run: |
          chmod +x build-lite.sh
          KEYBOOP_LITE_APP="/private/tmp/Keyboop Lite.app" ./build-lite.sh

      - name: Package app
        if: success()
        run: |
          ditto -c -k --sequesterRsrc --keepParent "/private/tmp/Keyboop Lite.app" "$RUNNER_TEMP/Keyboop-Lite.zip"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Keyboop-Lite-macOS-Apple-Silicon
          path: ${{ runner.temp }}/Keyboop-Lite.zip
          retention-days: 7
