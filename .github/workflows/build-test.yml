name: Build Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Keyboop Lite
        run: bash build-app.sh

      - name: Verify architecture, signature and dependencies
        run: |
          BIN="Keyboop Lite.app/Contents/MacOS/Keyboop Lite"
          file "$BIN"
          test "$(lipo -archs "$BIN")" = "arm64"
          codesign --verify --deep --strict --verbose=2 "Keyboop Lite.app"

          DEPS="$(otool -L "$BIN")"
          echo "$DEPS"
          if echo "$DEPS" | grep -Eiq 'AVFoundation|CoreML|SwiftUI|Translation|Sparkle|FluidAudio|whisper|ggml'; then
            echo "Heavy dependency leaked into Lite binary"
            exit 1
          fi

          du -sh "Keyboop Lite.app"
          du -h "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: Keyboop-Lite-arm64
          path: Keyboop-Lite-arm64.zip
          retention-days: 7
